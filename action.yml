name: aitb
description: Run an AITB preset and upload the evidence package + SARIF to code scanning
author: AITB contributors
branding:
  icon: check-circle
  color: gray

inputs:
  preset:
    description: preset 名称或 JSON 路径
    required: true
  strict:
    description: SKIP/BLOCKED 是否进退出码
    required: false
    default: "true"
  allow-red:
    description: 当 FAIL 全部来自负控时，按 0 退出
    required: false
    default: "false"
  python-version:
    required: false
    default: "3.12"

outputs:
  run-dir:
    description: 证据包目录
    value: ${{ steps.run.outputs.run-dir }}
  sarif:
    description: SARIF 文件路径
    value: ${{ steps.run.outputs.sarif }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - id: run
      shell: bash
      run: |
        set -o pipefail
        ARGS="${{ inputs.preset }}"
        [ "${{ inputs.strict }}" = "true" ] && ARGS="$ARGS --strict"
        [ "${{ inputs.allow-red }}" = "true" ] && ARGS="$ARGS --allow-red"
        aitb run $ARGS --format sarif --out "$RUNNER_TEMP/aitb.sarif"
        echo "sarif=$RUNNER_TEMP/aitb.sarif" >> "$GITHUB_OUTPUT"
        LATEST="$(cat .aitb/runs/latest.txt 2>/dev/null || ls -d .aitb/runs/*/ | tail -1)"
        echo "run-dir=$LATEST" >> "$GITHUB_OUTPUT"
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: aitb-evidence
        path: .aitb/runs
        if-no-files-found: warn
    - if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.run.outputs.sarif }}
        category: aitb
