[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mytool-adapter"
version = "0.1.0"
description = "Example third-party adapter for AITB"
requires-python = ">=3.9"
dependencies = ["aitb"]

[project.entry-points."aitb.adapters"]
mytool = "mytool_adapter:check"

[tool.setuptools.packages.find]
include = ["mytool_adapter*"]
