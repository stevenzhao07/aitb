[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aitb"
version = "0.1.0"
description = "AITB — Assurance Instrument Test Bench: a preset-driven acceptance bench that fails loudly, records evidence, and can be re-run by anyone."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AITB contributors" }]
keywords = ["conformance", "acceptance", "test-bench", "evidence", "sarif", "junit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/stevenzhao07/aitb"
Documentation = "https://github.com/stevenzhao07/aitb/blob/main/docs/QUICKSTART.md"
Issues = "https://github.com/stevenzhao07/aitb/issues"
Changelog = "https://github.com/stevenzhao07/aitb/blob/main/CHANGELOG.md"

[project.scripts]
aitb = "aitb.cli:main"

[project.entry-points."aitb.adapters"]
# 第三方适配器在此登记；引擎启动时会自动发现（见 CONTRIBUTING.md）

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aitb = ["presets/*.json", "probes/*.py", "schema/*.json"]
