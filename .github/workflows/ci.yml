name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 在 ubuntu-latest(24.04) 的 toolcache 里已不可用，单独钉 22.04
          - { os: ubuntu-22.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.9" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Preset schema-level validation
        run: aitb validate --all

      - name: It must be able to go red (negative control)
        shell: bash
        run: |
          set +e
          aitb selftest > selftest.txt
          rc=$?
          set -e
          echo "selftest exit code = $rc"
          test "$rc" -eq 1 || { echo "expected exit 1 (it is supposed to fail), got $rc"; exit 1; }
          grep -q "FAIL" selftest.txt || { echo "selftest produced no FAIL — the bench is blind"; exit 1; }

      - name: Self-test with --allow-red exits 0
        run: aitb selftest --allow-red

      - name: Doctrine (T1–T5) must hold
        run: aitb doctrine

      # 这一步是"外人能跑"的自动化证据：用仓库自带的上手样板，在一个陌生目录里
      # 只靠 JSON 跑起来，且红色必须全部按设计（--allow-red 才允许 0）。
      - name: Outsider example (examples/first-check) must work
        shell: bash
        working-directory: examples/first-check
        run: |
          rm -f report.json
          aitb run preset.json --allow-red --format junit --out first.junit.xml
          test -s report.json || { echo "the example tool did not produce report.json"; exit 1; }
          set +e
          aitb run preset.json > plain.txt
          rc=$?
          set -e
          test "$rc" -eq 1 || { echo "without --allow-red it must exit 1 (one by-design FAIL), got $rc"; exit 1; }
          grep -q "NEG-CTRL" plain.txt || { echo "negative control did not run"; exit 1; }
          python -c "import xml.etree.ElementTree as ET; r=ET.parse('first.junit.xml').getroot(); f=sum(int(s.get('failures','0')) for s in r.iter('testsuite')); assert f==1, f; print('junit sees exactly 1 by-design failure')"

      - name: Machine-readable outputs
        run: |
          aitb run selftest --allow-red --format junit --out selftest.junit.xml
          aitb run selftest --allow-red --format sarif --out selftest.sarif
          python -c "import xml.etree.ElementTree as ET, json; ET.parse('selftest.junit.xml'); json.load(open('selftest.sarif')); print('formats ok')"

      - name: Upload evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aitb-runs-${{ matrix.os }}-py${{ matrix.python }}
          path: .aitb/runs
          if-no-files-found: warn
